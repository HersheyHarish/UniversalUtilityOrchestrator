llm:
  # The values are mostly fetched from Environment Variables like AZURE_OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT, etc.
  model: "gpt-5.4-nano"
  temperature: 0.4
  max_tokens: 2048
  top_p: 0.9
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop: ["\n\n"]

guardrails:
  min_input_chars: 3
  max_input_chars: 5000
  blocked_patterns:
    - "(?i)ignore\\s+previous\\s+instructions"
    - "(?i)reveal\\s+(your\\s+)?(system|developer)\\s+prompt"
    - "(?i)bypass\\s+(all\\s+)?safety"
    - "(?i)act\\s+as\\s+root"

planning:
  max_steps: 6

orchestration:
  timeout_seconds: 30
  halt_on_step_failure: false
  use_demo_invoke: false
  log_level: "INFO"

evaluation:
  enabled: true
  model: "llama3.1:8b"
  timeout: 60

pii_masking:
  # Optional custom overrides. If omitted, built-in defaults mask emails,
  # phone numbers, SSNs, and long account-like identifiers.
  patterns: []

memory:
  provider: "auto"  # "cosmosdb", "local_file", or "auto"
  local_traces_dir: "traces"
