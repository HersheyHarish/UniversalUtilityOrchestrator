llm:
  # The values are mostly fetched from Environment Variables like AZURE_OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT, etc.
  model: "gpt-4o"
  temperature: 0.4
  max_tokens: 2048
  top_p: 0.9
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop: ["\n\n"]

guardrails:
  min_input_chars: 3
  max_input_chars: 5000
  blocked_patterns:
    - "(?i)ignore\\s+previous\\s+instructions"
    - "(?i)reveal\\s+(your\\s+)?(system|developer)\\s+prompt"
    - "(?i)bypass\\s+(all\\s+)?safety"
    - "(?i)act\\s+as\\s+root"

planning:
  max_steps: 6

orchestration:
  timeout_seconds: 30
  halt_on_step_failure: true
  use_demo_invoke: true
  log_level: "DEBUG"
